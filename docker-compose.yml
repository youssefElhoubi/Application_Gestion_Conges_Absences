services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seeder:
    build:
      context: .
      dockerfile: dockerfile
      target: seeder
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-mydatabase}?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminPassword123!}
      SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD:-EmployeePassword123!}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: dockerfile
      target: runner
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-mydatabase}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-absnace-super-secret-jwt-key-min-32-chars-long-2026!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      seeder:
        condition: service_completed_successfully

  prisma-studio:
    build:
      context: .
      dockerfile: dockerfile
      target: studio
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@db:5432/${POSTGRES_DB:-mydatabase}?schema=public
    restart: "no"
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
