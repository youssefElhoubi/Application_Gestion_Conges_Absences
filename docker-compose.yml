
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  seeder:
    build:
      context: .
      dockerfile: dockerfile
      target: seeder
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydatabase?schema=public
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: dockerfile
      target: runner
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydatabase?schema=public
    depends_on:
      seeder:
        condition: service_completed_successfully

  prisma-studio:
    build:
      context: .
      dockerfile: dockerfile
      target: builder
    command:
      - npx
      - prisma
      - studio
      - --port
      - "5555"
      - --browser
      - none
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydatabase?schema=public
    restart: "no"
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
